server {
    listen 80;
    server_name ~^(?<slug>[a-z0-9-]+)\.apps\.fringelo\.com$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ~^(?<slug>[a-z0-9-]+)\.apps\.fringelo\.com$;

    ssl_certificate /etc/letsencrypt/live/apps.fringelo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.fringelo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/deploys/$slug/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
